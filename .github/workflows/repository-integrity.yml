name: Repository Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build repository census
        run: python tools/repository_census.py

      - name: Publish repository manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-manifest
          path: repository-manifest/*.json
          if-no-files-found: error

      - name: Validate repository integrity
        run: python tools/repository_integrity_audit.py

      - name: Validate Python syntax
        run: python -m compileall -q -f .

      - name: Validate JSON and JSON-LD documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bad = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.parts[0] == '.git' or path.suffix.lower() not in {'.json', '.jsonld'}:
                  continue
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append(f'{path}: {exc}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit(1)
          print('All JSON and JSON-LD documents parsed successfully.')
          PY

      - name: Show census summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('repository-manifest/repository-manifest.json').read_text(encoding='utf-8'))
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
